# 01: color only; no glow, blur, or post-processing.
[theme]
preset=cyberpunk

[style]
FrameRounding=2
ChildRounding=4
FramePadding=12,6
ItemSpacing=12,8

[colors]
WindowBg=#090D18
ChildBg=#121B2B
Text=#E3F8FF

[extras]
accent=#00E5FF
accent_text=#071018
danger=#FF3DA6
danger_text=#170D18
shadow_offset=0
outline_buttons=false

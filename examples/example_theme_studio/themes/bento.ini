# 10: shared card layout, matte surfaces, no gradient or soft shadow.
[theme]
preset=bento

[style]
FrameRounding=5
ChildRounding=8
FramePadding=12,6
ItemSpacing=12,8

[colors]
WindowBg=#101316
ChildBg=#1B2026
Text=#E8EEF2
Border=#303840

[extras]
accent=#C9F27A
accent_text=#101316
danger=#F58C91
danger_text=#251012
shadow_offset=0
outline_buttons=false

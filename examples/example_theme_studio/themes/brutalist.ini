# 07: solid colors, dark outlines and one offset rectangle per action button.
[theme]
preset=brutalist

[style]
FrameRounding=0
ChildRounding=0
FramePadding=12,6
ItemSpacing=12,8

[colors]
WindowBg=#FFF8E8
ChildBg=#FFFDF5
Text=#171717
Border=#171717
Header=#FFE15B
TableHeaderBg=#FFE15B

[extras]
accent=#375BFF
accent_text=#FFFFFF
danger=#FF8A7A
danger_text=#171717
shadow=#171717
shadow_offset=3
outline_buttons=false

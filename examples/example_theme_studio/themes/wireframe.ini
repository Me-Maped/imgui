# 04: flat graphite surfaces and fine outlines.
[theme]
preset=wireframe

[style]
FrameRounding=0
ChildRounding=0
FrameBorderSize=1
FramePadding=12,6
ItemSpacing=12,8

[colors]
WindowBg=#15181C
ChildBg=#1A1E24
Text=#DEE5EC
Border=#46505E

[extras]
accent=#F3BC59
accent_text=#15181C
danger=#F47B83
danger_text=#15181C
shadow_offset=0
outline_buttons=true

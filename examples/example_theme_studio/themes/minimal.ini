# 03: warm white, small radii, restrained separators.
[theme]
preset=minimal

[style]
FrameRounding=3
ChildRounding=4
FramePadding=12,6
ItemSpacing=12,8

[colors]
WindowBg=#F7F7F5
ChildBg=#FFFFFF
Text=#242729

[extras]
